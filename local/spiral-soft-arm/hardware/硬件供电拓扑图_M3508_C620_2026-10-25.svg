<rect width="2600" height="1800" fill="#f5f8fb"/>
<text x="55" y="66" class="title">B32 水下软体机械臂｜M3508 / C620 供电拓扑重规划</text>
<text x="58" y="105" class="sub">24 V 岸电主供 · 4S1P / 8 Ah 限流备电 · 控制优先 · 单电机低功率应急通道</text>
<rect x="1900" y="27" width="645" height="91" rx="16" fill="#e9f0f5" stroke="#b9c9d4" stroke-width="2"/>
<text x="1930" y="62" class="ct">目标：岸电运行约 30 min</text><text x="1930" y="92" class="small">断岸电 15 min 按限功率备电设计，待实测</text>
<line x1="60" y1="150" x2="112" y2="150" class="wire shore"/><text x="126" y="156" class="small">岸电 24 V 主动力</text>
<line x1="335" y1="150" x2="387" y2="150" class="wire backup"/><text x="401" y="156" class="small">4S 电池备电</text>
<line x1="610" y1="150" x2="662" y2="150" class="wire logic"/><text x="676" y="156" class="small">UPS 控制母线</text>
<line x1="905" y1="150" x2="957" y2="150" class="wire aux"/><text x="971" y="156" class="small">Type‑C 辅助 / 电池充电支路</text>
<line x1="1305" y1="150" x2="1357" y2="150" class="wire sensor"/><text x="1371" y="156" class="small">监测信号</text>
<line x1="1570" y1="150" x2="1622" y2="150" class="wire safety"/><text x="1636" y="156" class="small">急停 / 岸电状态互锁</text>

