<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1240" viewBox="0 0 1920 1240" role="img" aria-labelledby="title desc">
<title id="title">B32 水下机械臂供电拓扑</title>
<desc id="desc">简洁分区图：岸上24V直供三路M3508/C620，USB-C PD同时为UPS AUX辅助并作为4S电池备用充电输入；岸电优先，经单级16.8V CC/CV充电器和BMS充电。</desc>
<defs>
  <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#bf4b45"/></marker>
  <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#8054a8"/></marker>
  <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#c27b16"/></marker>
  <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#3978b9"/></marker>
  <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#22836d"/></marker>
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;fill:#20313f}
    .title{font-size:34px;font-weight:700;letter-spacing:.2px}
    .subtitle{font-size:17px;fill:#647585}
    .zone{font-size:17px;font-weight:700;fill:#526574}
    .head{font-size:19px;font-weight:700}
    .body{font-size:16px;fill:#415363}
    .small{font-size:14px;fill:#5f7180}
    .tiny{font-size:12px;fill:#6d7d89}
    .card{fill:#fff;stroke:#d6e0e7;stroke-width:1.6}
    .panel{fill:#f8fafc;stroke:#dce5eb;stroke-width:1.5}
    .wire{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .shore{stroke:#bf4b45;marker-end:url(#arrow-red)}
    .usb{stroke:#8054a8;stroke-dasharray:9 7;marker-end:url(#arrow-purple)}
    .charge{stroke:#c27b16;marker-end:url(#arrow-amber)}
    .backup{stroke:#c27b16;marker-end:url(#arrow-amber)}
    .logic{stroke:#3978b9;marker-end:url(#arrow-blue)}
    .sense{stroke:#22836d;stroke-dasharray:7 6;marker-end:url(#arrow-teal)}
    .emergency{stroke:#c27b16;stroke-dasharray:7 6;marker-end:url(#arrow-amber)}
    .accent-red{fill:#bf4b45}.accent-purple{fill:#8054a8}.accent-amber{fill:#c27b16}
    .chip{font-size:13px;font-weight:700;fill:#516473}
    .label{font-size:13px;font-weight:700;fill:#596c7a;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}
  </style>
</defs>
<rect width="1920" height="1240" fill="#f3f6f8"/>

<!-- Header -->
<text x="58" y="60" class="title">B32 水下机械臂｜M3508 / C620 供电拓扑</text>
<text x="60" y="91" class="subtitle">岸电直供动力　·　USB‑C 双用途辅助　·　岸电优先给 4S 电池充电　·　外部电源失效后由电池备电</text>
<rect x="1550" y="27" width="315" height="75" rx="14" fill="#e8eef3"/>
<text x="1574" y="57" class="head">运行目标</text>
<text x="1574" y="82" class="small">岸电约 30 min　/　断电保持控制 15 min*</text>

<!-- Compact legend -->
<line x1="60" y1="133" x2="96" y2="133" class="wire shore"/><text x="108" y="138" class="small">24 V 岸电动力</text>
<line x1="270" y1="133" x2="306" y2="133" class="wire usb"/><text x="318" y="138" class="small">USB‑C PD 输入 / 充电</text>
<line x1="555" y1="133" x2="591" y2="133" class="wire backup"/><text x="603" y="138" class="small">4S 电池 / 备电</text>
<line x1="795" y1="133" x2="831" y2="133" class="wire logic"/><text x="843" y="138" class="small">UPS 控制输出</text>

<!-- Zones -->
<rect x="40" y="175" width="350" height="660" rx="18" class="panel"/>
<rect x="415" y="175" width="705" height="660" rx="18" class="panel"/>
<rect x="1145" y="175" width="735" height="660" rx="18" class="panel"/>
<text x="60" y="210" class="zone">01　输入源</text>
<text x="440" y="210" class="zone">02　保护、充电与 UPS</text>
<text x="1170" y="210" class="zone">03　驱动与控制</text>

<!-- Wires behind cards -->
<path d="M360 300H450" class="wire shore"/>
<path d="M750 300H1180" class="wire shore"/>
<path d="M650 380V430" class="wire shore"/>
<path d="M750 345H900V430" class="wire shore"/>
<path d="M360 485H450" class="wire usb"/>
<path d="M750 530H800" class="wire usb"/>
<path d="M620 600V655" class="wire charge"/>
<path d="M360 720H450" class="wire backup"/>
<path d="M750 720H780V590H800" class="wire backup"/>
<path d="M1090 535H1180" class="wire logic"/>
<path d="M1045 435V420H1180" class="wire emergency"/>
<text x="1060" y="411" class="label">K2 ≤5 A</text>

<!-- Inputs -->
<rect x="60" y="235" width="300" height="130" rx="13" class="card"/>
<rect x="60" y="235" width="7" height="130" rx="4" class="accent-red"/>
<text x="82" y="270" class="head">隔离岸电 24 V</text>
<text x="82" y="300" class="body">J1　5 m 脐带缆 · 双芯 4 mm²</text>
<text x="82" y="328" class="small">+24 V / 0 V 回流；PE 留岸上</text>
<rect x="60" y="400" width="300" height="155" rx="13" class="card"/>
<rect x="60" y="400" width="7" height="155" rx="4" class="accent-purple"/>
<text x="82" y="435" class="head">USB‑C PD　J7</text>
<text x="82" y="465" class="body">受电协商 20 V，分供两路</text>
<text x="82" y="493" class="small">→ UPS AUX　/　→ 充电输入 B</text>
<text x="82" y="522" class="tiny">AUX 与充电共用 PD 功率限额</text>
<rect x="60" y="645" width="300" height="150" rx="13" class="card"/>
<rect x="60" y="645" width="7" height="150" rx="4" class="accent-amber"/>
<text x="82" y="680" class="head">4S1P 电池　J2</text>
<text x="82" y="710" class="body">NCR21700T · 8 Ah</text>
<text x="82" y="738" class="small">14.8 V 标称　/　16.8 V 满充</text>
<text x="82" y="767" class="tiny">标称能量约 118.4 Wh</text>

<!-- Power conditioning -->
<rect x="450" y="245" width="300" height="135" rx="13" class="card"/>
<rect x="450" y="245" width="7" height="135" rx="4" class="accent-red"/>
<text x="472" y="280" class="head">J3　岸电入口保护</text>
<text x="472" y="310" class="body">F_MAIN · 反接 / 瞬态保护</text>
<text x="472" y="338" class="small">采集岸电电压、电流</text>
<text x="472" y="361" class="tiny">保护后分往电机、UPS、充电器</text>

<rect x="450" y="430" width="300" height="170" rx="13" class="card"/>
<rect x="450" y="430" width="7" height="170" rx="4" class="accent-purple"/>
<text x="472" y="466" class="head">J12　双输入 4S 充电 / 分配</text>
<text x="472" y="496" class="body">输入 A：岸电 24 V</text>
<text x="472" y="523" class="body">输入 B：USB‑C PD 20 V</text>
<text x="472" y="550" class="small">岸电优先；PD 备用并分支至 AUX</text>
<text x="472" y="577" class="small">单级 16.8 V CC/CV → BMS</text>

<rect x="450" y="655" width="300" height="150" rx="13" class="card"/>
<rect x="450" y="655" width="7" height="150" rx="4" class="accent-amber"/>
<text x="472" y="690" class="head">J4 / J5　BMS 与备电</text>
<text x="472" y="720" class="body">BMS P± → 24 V / 15 A 升压</text>
<text x="472" y="748" class="small">J12 的 EXT_PWR_GOOD 有效时关断</text>
<text x="472" y="776" class="tiny">两路外部电源均失效才启用</text>

<!-- UPS -->
<rect x="800" y="430" width="290" height="225" rx="14" fill="#edf4fb" stroke="#bfd0de" stroke-width="1.6"/>
<rect x="800" y="430" width="7" height="225" rx="4" fill="#3978b9"/>
<text x="822" y="466" class="head">UPS　电源选择 / 控制</text>
<text x="822" y="498" class="body">MAIN ← 岸电保护支路</text>
<text x="822" y="526" class="body">AUX ← USB‑C PD　/　BACKUP ← J5</text>
<text x="822" y="556" class="body">OUT → STM32 与控制负载</text>
<text x="822" y="586" class="small">仅低功率控制；核对端口额定</text>
<text x="822" y="618" class="tiny">外部输入有效时关闭电池升压</text>

<!-- Loads -->
<rect x="1180" y="245" width="650" height="190" rx="14" class="card"/>
<rect x="1180" y="245" width="7" height="190" rx="4" class="accent-red"/>
<text x="1204" y="281" class="head">J8–J10　24 V 动力母线 → 三路驱动</text>
<text x="1204" y="313" class="body">K1 岸电主路　/　K2 UPS 应急支路（≤5 A、单轴）</text>
<text x="1204" y="344" class="body">F1–F3 → C620 ×3 → M3508 ×3</text>
<text x="1204" y="375" class="small">每台：三相 U/V/W + 7‑Pin；STM32 本地 CAN</text>
<text x="1204" y="407" class="small">J11 NC 急停释放 K1/K2；DC 0 V 单点星形回流</text>

<rect x="1180" y="500" width="650" height="195" rx="14" fill="#edf4fb" stroke="#bfd0de" stroke-width="1.6"/>
<rect x="1180" y="500" width="7" height="195" rx="4" fill="#3978b9"/>
<text x="1204" y="536" class="head">J6 / J13　控制与监测</text>
<text x="1204" y="568" class="body">STM32G474VET6：UPS OUT 24 V → 单级 24→5 V</text>
<text x="1204" y="599" class="body">CAN → C620 ×3　·　采集岸电 / 母线 / 电池 V、I</text>
<text x="1204" y="630" class="small">温度：电池、升压器、C620 ×3；UPS 保持控制</text>
<text x="1204" y="662" class="tiny">PE 不下水；水体、拉索与机壳不作回流</text>

<!-- Key design limits -->
<text x="60" y="875" class="zone">关键边界</text>
<rect x="60" y="895" width="560" height="170" rx="14" class="card"/>
<text x="84" y="931" class="head">主动力与线缆</text>
<text x="84" y="962" class="body">三台额定点约 720 W / 30 A；岸电建议 ≥35 A</text>
<text x="84" y="993" class="small">4 mm²、5 m：30 A 时约 1.31 V / 39 W 损耗</text>
<text x="84" y="1024" class="small">保留现线先限 ≤15 A；30 A 需考虑约 10 mm²</text>
<text x="84" y="1048" class="tiny">线材、端子和温升仍需实测</text>

<rect x="680" y="895" width="560" height="170" rx="14" class="card"/>
<text x="704" y="931" class="head">充电与功率分配</text>
<text x="704" y="962" class="body">岸电优先；岸电不可用时 Type‑C 为备用充电源</text>
<text x="704" y="993" class="small">两路不并联；Type‑C AUX + 充电不超 PD 合同</text>
<text x="704" y="1024" class="small">20 V PD → 16.8 V CC/CV；充电电流动态限流</text>
<text x="704" y="1048" class="tiny">实际充电器 / BMS 型号和电流待核定</text>

<rect x="1300" y="895" width="560" height="170" rx="14" class="card"/>
<text x="1324" y="931" class="head">备电能力与验证</text>
<text x="1324" y="962" class="body">4S1P 8 Ah ≈ 118.4 Wh；24 V / 10 A 备电上限</text>
<text x="1324" y="993" class="small">15 min 需至少 60 Wh；三台满额需约 180 Wh</text>
<text x="1324" y="1024" class="small">备电按控制与低功率单轴动作设计，不支持满额</text>
<text x="1324" y="1048" class="tiny">30 min 温升、15 min 断电续航需台架验证</text>

<!-- Interface strip -->
<rect x="60" y="1090" width="1800" height="100" rx="13" fill="#e8eef3"/>
<text x="84" y="1124" class="chip">接口速查</text>
<text x="84" y="1151" class="small">J1 脐带缆　·　J2 电池 / BMS　·　J3 岸电保护　·　J4/J5 BMS / 升压备电　·　J6 STM32 供电　·　J7 USB‑C PD→UPS AUX + 充电输入</text>
<text x="84" y="1178" class="small">J8 动力母线　·　J9/J10 C620 / M3508　·　J11 急停　·　J12 双输入 4S 充电　·　J13 电压 / 电流 / 温度监测　　* 目标值待实测</text>
</svg>
