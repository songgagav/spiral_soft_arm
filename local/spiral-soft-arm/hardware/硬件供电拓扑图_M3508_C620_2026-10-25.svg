<path d="M850 625V700H745" class="wire aux"/>

<!-- Shore source and tether -->
<rect x="70" y="270" width="430" height="145" rx="15" class="card"/>
<rect x="70" y="270" width="9" height="145" rx="4" fill="#bb3944"/>
<text x="95" y="307" class="ct">隔离 24 V 岸上电源</text>
<text x="95" y="340" class="body">主供电：额定点按三电机约 30 A</text>
<text x="95" y="372" class="small">电源建议 ≥35 A 连续；PE 留在岸上</text>
<rect x="70" y="945" width="430" height="155" rx="15" class="card"/>
<rect x="70" y="945" width="9" height="155" rx="4" fill="#bb3944"/>
<text x="95" y="982" class="ct">J1｜水下动力脐带缆</text>
<text x="95" y="1015" class="body">现有 5 m · 两芯各 4 mm²</text>
<text x="95" y="1048" class="small">芯 1：+24 V　芯 2：0 V 回流</text>
<text x="95" y="1078" class="tiny">30 A 时估算压降约 1.31 V，见下方说明</text>
<rect x="70" y="700" width="430" height="160" rx="15" class="card"/>
<rect x="70" y="700" width="9" height="160" rx="4" fill="#c47a12"/>
<text x="95" y="737" class="ct">J2｜4S1P 电池组</text>
<text x="95" y="770" class="body">NCR21700T · 8 Ah（按已确认参数）</text>
<text x="95" y="803" class="small">14.8 V 标称 · 16.8 V 满充</text>
<text x="95" y="832" class="tiny">标称能量约 118.4 Wh</text>
<rect x="70" y="465" width="430" height="160" rx="15" class="card"/>
<rect x="70" y="465" width="9" height="160" rx="4" fill="#8052a5"/>
<text x="95" y="502" class="ct">J7｜USB‑C PD 辅助 / 充电输入</text>
<text x="95" y="535" class="body">PD 受电协商 20 V；向 AUX 与充电器分流</text>
<text x="95" y="568" class="small">岸电优先充电；无岸电时 Type‑C 可充电</text>
<text x="95" y="597" class="tiny">UPS AUX 与充电共用PD功率预算，先限流</text>

<!-- Power protection, battery conversion, charger -->
<rect x="620" y="270" width="450" height="145" rx="15" class="card"/>
<rect x="620" y="270" width="9" height="145" rx="4" fill="#bb3944"/>
<text x="645" y="307" class="ct">J3｜岸电入口与保护</text>
<text x="645" y="340" class="body">水密穿舱 → F_MAIN → 反接 / 浪涌保护</text>
<text x="645" y="373" class="small">监测 V_SHORE、I_SHORE；正极设保险</text>
<text x="645" y="400" class="tiny">输入 0 V 接系统回流星点，不接水体 / PE</text>
<rect x="620" y="470" width="450" height="155" rx="15" class="card"/>
<rect x="620" y="470" width="9" height="155" rx="4" fill="#8052a5"/>
<text x="645" y="507" class="ct">J12｜4S 双输入充电器 / 选源</text>
<text x="645" y="540" class="body">岸电 24 V 或 PD 20 V → 优先选源</text>
<text x="645" y="573" class="small">单级 16.8 V CC/CV → BMS 充电端</text>
<text x="645" y="603" class="tiny">不并联两输入；限流按电芯与 BMS 规格</text>
<rect x="620" y="700" width="250" height="160" rx="15" class="card"/>
<rect x="620" y="700" width="9" height="160" rx="4" fill="#c47a12"/>
<text x="645" y="737" class="ct">J4｜4S BMS</text>
<text x="645" y="770" class="body">B− / B1…B3 / B+</text>
<text x="645" y="803" class="small">放电 / 充电端按 BMS 型号接线</text>
<text x="645" y="832" class="tiny">电芯 NTC 与放电电流保护</text>
<rect x="900" y="700" width="310" height="160" rx="15" class="card"/>
<rect x="900" y="700" width="9" height="160" rx="4" fill="#c47a12"/>
<text x="925" y="737" class="ct">J5｜电池升压 / 限流</text>
<text x="925" y="770" class="body">BMS P± → 9–35 V / 24 V、15 A</text>
<text x="925" y="803" class="small">备电总输出限在 ≤10 A；EXT_PWR_GOOD 互锁</text>
<text x="925" y="832" class="tiny">岸电或 PD 任一在：升压关；两者全失效才启动</text>
<rect x="620" y="945" width="450" height="155" rx="15" class="card"/>
<text x="645" y="982" class="ct">电池充电与温度监测</text>
<text x="645" y="1015" class="body">岸电优先；无岸电则 Type‑C 可充</text>
<text x="645" y="1048" class="small">任一外部电源在：备电升压关闭</text>
<text x="645" y="1078" class="tiny">T_BAT、T_BOOST、I_BAT / V_BAT → STM32</text>

<!-- Source selection and emergency control -->
<rect x="1220" y="270" width="480" height="170" rx="16" fill="#fff7f6" stroke="#cf7d83" stroke-width="2"/>
<rect x="1220" y="270" width="9" height="170" rx="4" fill="#bb3944"/>
<text x="1247" y="307" class="ct">K1｜岸电主电机接触器</text>
<text x="1247" y="340" class="body">24 V 岸电 → 电机主母线</text>
<text x="1247" y="373" class="small">DC 额定触点；NC 急停 / 岸电故障释放</text>
<text x="1247" y="407" class="tiny">主路径按 ≥35 A 连续设计，支路分别保护</text>
<rect x="1220" y="500" width="480" height="240" rx="16" fill="#f0f5fa" stroke="#86a4ba" stroke-width="2"/>
<rect x="1220" y="500" width="9" height="240" rx="4" fill="#3676b9"/>
<text x="1247" y="537" class="ct">UPS｜控制与低功率备电母线</text>
<text x="1247" y="571" class="body">MAIN ← 岸电保护支路　BACKUP ← J5</text>
<text x="1247" y="605" class="body">AUX ← J7 电压匹配 PD　OUT → 控制负载</text>
<text x="1247" y="642" class="small">UPS 输出只带控制器、CAN、传感器和 K2 支路</text>
<text x="1247" y="676" class="small">核对 MAIN / OUT 连续电流与切换时间</text>
<text x="1247" y="711" class="tiny">若 UPS 额定不足，保留它只带控制母线</text>
<rect x="1220" y="835" width="480" height="180" rx="16" fill="#fff9eb" stroke="#d2ab5d" stroke-width="2"/>
<rect x="1220" y="835" width="9" height="180" rx="4" fill="#c47a12"/>
<text x="1247" y="872" class="ct">K2｜可选电机应急支路</text>
<text x="1247" y="905" class="body">UPS OUT → 限流器（≤5 A）→ 电机母线</text>
<text x="1247" y="938" class="small">K1 / K2 互锁，先断主路再接备电</text>
<text x="1247" y="970" class="small">仅单台、低速动作；计入备电 ≤10 A 总预算</text>
<text x="1247" y="998" class="tiny">超预算则 K2 断开，保持控制与监测</text>
<rect x="1220" y="1040" width="480" height="100" rx="15" fill="#fff" stroke="#d2ab5d" stroke-width="2"/>
<text x="1247" y="1078" class="ct">J11｜岸上 NC 急停 / 故障互锁</text>
<text x="1247" y="1110" class="small">急停或断线 → K1、K2 释放；UPS 控制输出保留</text>

<!-- Power distribution and loads -->
<rect x="1820" y="270" width="690" height="145" rx="15" class="card"/>
<rect x="1820" y="270" width="9" height="145" rx="4" fill="#bb3944"/>
<text x="1847" y="307" class="ct">J8｜24 V 电机配电母线</text>
<text x="1847" y="340" class="body">K1 主供 / K2 限流备供 → 总压、电流采样</text>
<text x="1847" y="373" class="small">F1–F3 独立支路保险 → 三只 C620</text>
<text x="1847" y="402" class="tiny">正极配电；DC 0 V 以单点星形回流</text>
<rect x="1820" y="475" width="690" height="305" rx="15" fill="#fff" stroke="#9fb0bd" stroke-width="2"/>
<text x="1847" y="512" class="ct">J9 / J10｜三路电调与电机</text>
<line x1="1845" y1="535" x2="2485" y2="535" stroke="#e1e7ec" stroke-width="2"/>
<text x="1850" y="574" class="body">F1 → C620‑1</text><text x="2055" y="574" class="small">三相 U/V/W + 7‑Pin → M3508‑1</text>
<line x1="1845" y1="595" x2="2485" y2="595" stroke="#e1e7ec" stroke-width="2"/>
<text x="1850" y="634" class="body">F2 → C620‑2</text><text x="2055" y="634" class="small">三相 U/V/W + 7‑Pin → M3508‑2</text>
<line x1="1845" y1="655" x2="2485" y2="655" stroke="#e1e7ec" stroke-width="2"/>
<text x="1850" y="694" class="body">F3 → C620‑3</text><text x="2055" y="694" class="small">三相 U/V/W + 7‑Pin → M3508‑3</text>
<text x="1850" y="744" class="tiny">STM32 本地 CAN → C620 总线；电机线束与 CAN 分开固定</text>
<rect x="1820" y="835" width="300" height="185" rx="15" fill="#f0f5fa" stroke="#86a4ba" stroke-width="2"/>
<text x="1847" y="872" class="ct">J6｜控制电源支路</text>
<text x="1847" y="905" class="body">UPS OUT 24 V → F_LOGIC</text>
<text x="1847" y="938" class="small">24 V → 5 V 降压模块</text>
<text x="1847" y="970" class="small">控制电源与 K1 电机支路分开</text>
<text x="1847" y="1000" class="tiny">UPS 输出额定值需覆盖逻辑负载</text>
<rect x="2150" y="835" width="360" height="185" rx="15" class="card"/>
<text x="2177" y="872" class="ct">STM32G474VET6</text>
<text x="2177" y="905" class="body">CAN → C620 ×3；岸端 CAN 独立隔离</text>
<text x="2177" y="938" class="small">读取总线 / 电池 V、I，电调 / 模块温度</text>
<text x="2177" y="970" class="small">岸电故障：限流、停电机或启用 K2</text>
<text x="2177" y="1000" class="tiny">ADC 输入保护；传感器量程按母线重选</text>
<rect x="1820" y="1045" width="690" height="95" rx="15" fill="#eef8f4" stroke="#83b6a0" stroke-width="2"/>
<text x="1847" y="1082" class="ct">J13｜监测与回流</text>
<text x="1847" y="1114" class="small">I/V：岸电、24 V 母线、备电；温度：电池、升压器、C620 ×3；PE 不下水，电缆 0 V 是回流线</text>
<text x="1710" y="890" class="tiny" transform="rotate(-90 1710 890)">J11 NC 故障回路 → K1 / K2 线圈</text>

<!-- Power budgets -->
<text x="55" y="1230" class="zone">供电预算与运行边界</text>
<rect x="55" y="1250" width="790" height="240" rx="16" fill="#fff" stroke="#d3a3a7" stroke-width="2"/>
<text x="82" y="1290" class="ct">① 岸电主供与 5 m 脐带压降</text>
<text x="82" y="1328" class="body">M3508/C620 额定点约 24 V × 10 A × 3 = 720 W（30 A），</text>
<text x="82" y="1360" class="body">再加控制负载，岸上电源及主路径建议 ≥35 A 连续。</text>
<text x="82" y="1400" class="small">4 mm² 铜线、5 m 单程（10 m 回路）：30 A 压降约 1.31 V；</text>
<text x="82" y="1430" class="small">若保留该线，建议总电流先限 ≤15 A；30 A 工况改约 10 mm²，</text>
<text x="82" y="1460" class="tiny">并按线材温度等级、接插件和水下弯曲要求复核。压降为估算。</text>
<rect x="875" y="1250" width="790" height="240" rx="16" fill="#fffaf0" stroke="#d2ab5d" stroke-width="2"/>
<text x="902" y="1290" class="ct">② 4S1P 8 Ah 备电预算</text>
<text x="902" y="1328" class="body">标称 118.4 Wh；24 V / 10 A 备电上限对应 240 W。</text>
<text x="902" y="1360" class="body">15 min 需 60 Wh 输出，尚需计入变换损耗与电池余量。</text>
<text x="902" y="1400" class="small">电池侧约 20–24 A；BMS、电芯、保险和导线须满足。</text>
<text x="902" y="1430" class="small">三台额定点运行 15 min 需约 180 Wh，当前电池不能支持。</text>
<text x="902" y="1460" class="tiny">断岸电默认保控制 15 min；K2 只供低功率单轴动作，并需实测。</text>
<rect x="1695" y="1250" width="850" height="240" rx="16" fill="#fff" stroke="#aebdc8" stroke-width="2"/>
<text x="1722" y="1290" class="ct">③ 接地、充电与保护原则</text>
<text x="1722" y="1328" class="body">岸上隔离 24 V 的 +24 V / 0 V 两根都下水；0 V 为电流回路。</text>
<text x="1722" y="1360" class="body">AC PE 只按岸上电源说明接 FG / 机壳，不接水体或作回流。</text>
<text x="1722" y="1400" class="small">保险放正极；急停切电机，控制与监测由 UPS 保持。</text>
<text x="1722" y="1430" class="small">岸电 / Type‑C 均可充 4S；USB‑C 总功率限额，输入不直接并联。</text>
<text x="1722" y="1460" class="tiny">核实 UPS 主路额定、备电切换、电机回灌吸收和机舱散热。</text>

<rect x="55" y="1520" width="2490" height="205" rx="16" fill="#eaf0f5" stroke="#b8c7d1" stroke-width="2"/>
<text x="82" y="1560" class="ct">接口速查</text>
<text x="82" y="1595" class="small">J1 脐带 +24/0V　·　J2 电芯→BMS　·　J3 岸电保护入口　·　J4 BMS 放电端　·　J5 24 V 电池升压→UPS BACKUP</text>
