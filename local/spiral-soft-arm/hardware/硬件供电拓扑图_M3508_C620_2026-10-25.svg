<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="1800" viewBox="0 0 2600 1800" role="img" aria-labelledby="title desc">
<title id="title">B32 M3508/C620供电拓扑重规划</title>
<desc id="desc">岸上隔离24伏电源直供电机主母线；岸电和Type-C PD均可经优先选源及16.8伏CC/CV充电级给4S电池充电；Type-C还可限功率辅助UPS AUX。</desc>
