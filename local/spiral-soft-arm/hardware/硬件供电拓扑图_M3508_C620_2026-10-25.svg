<rect x="40" y="205" width="520" height="970" rx="20" fill="#f0f4f7" stroke="#c4d0d9" class="panel"/>
<rect x="580" y="205" width="1190" height="970" rx="20" fill="#edf4f9" stroke="#829aac" class="panel"/>
<rect x="1790" y="205" width="770" height="970" rx="20" fill="#edf7f6" stroke="#8fb5ad" class="panel"/>
<text x="70" y="245" class="zone">岸上 / 脐带缆 / 电池</text>
<text x="610" y="245" class="zone">干舱：保护、转换、UPS 与互锁</text>
<text x="1820" y="245" class="zone">24 V 配电、驱动与控制</text>

